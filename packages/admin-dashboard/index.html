<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/admin/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/admin/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/admin/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f0f2f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kala Admin" />
    <link rel="manifest" href="/admin/manifest.json" />
    <title>Kala Moms & Baby Spa — Admin Dashboard</title>
    <!-- Anti-flicker tema: terapkan .dark sebelum React boot (baca localStorage yang sama dengan ThemeContext) -->
    <script>
      try {
        var stored = localStorage.getItem('wa_clinic_theme');
        var dark = stored === 'dark' || (((stored === null) || (stored === 'system')) &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-app text-ink font-sans antialiased transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
