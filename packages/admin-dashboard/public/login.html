<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Control Center | Kala Baby & Moms Spa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-pink: #ec4899;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-pink);
    }

    .btn-login {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(to right, #ec4899, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: opacity 0.2s;
    }

    .btn-login:hover {
      opacity: 0.9;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Control Center</h1>
    <p class="subtitle">Kala Baby & Moms Spa</p>

    <form id="login-form">
      <div class="form-group">
        <label for="admin-key">Password / ADMIN_API_KEY:</label>
        <input type="password" id="admin-key" placeholder="Masukkan kunci admin..." required />
      </div>
      <div class="form-group">
        <label for="admin-identity">Identitas Pemeriksa:</label>
        <input type="text" id="admin-identity" placeholder="Contoh: Bidan Kenanga" value="Bidan Admin" required />
      </div>
      <button type="submit" class="btn-login">🔑 Masuk ke Sistem</button>
      <div class="error-msg" id="error-msg">Password / Kunci Admin salah.</div>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const apiKey = document.getElementById('admin-key').value;
      const adminIdentity = document.getElementById('admin-identity').value;
      const errorMsg = document.getElementById('error-msg');

      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey, adminIdentity })
        });

        const result = await res.json();
        if (res.ok) {
          // Success: redirect to staging review page
          window.location.href = 'staging.html';
        } else {
          errorMsg.innerText = result.error || 'Password / Kunci Admin salah.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.innerText = 'Gagal menghubungi server.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
