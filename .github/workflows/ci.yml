name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Base Branch (PR)
        if: github.base_ref != ''
        run: git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Install Admin Dashboard Dependencies
        run: |
          cd packages/admin-dashboard
          npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Security Scan (Secret Leak Detection)
        run: npm run security:scan

      - name: Backlog Evidence Gate
        run: npm run verify:backlog

      - name: Typecheck Backend
        run: npm run typecheck

      - name: Reuse Gate
        run: node scripts/reuse/check-reuse.mjs --json > reuse-report.json

      - name: Upload Reuse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reuse-report
          path: reuse-report.json

      - name: Architecture Gate
        run: node scripts/reuse/check-architecture.mjs --json > architecture-report.json

      - name: Upload Architecture Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-report
          path: architecture-report.json

      # Mencegah baseline diedit manual naik (gate biasa hanya membandingkan kode
      # terhadap baseline, bukan baseline terhadap commit sebelumnya).
      - name: Baseline Ratchet Integrity
        env:
          BASELINE_BASE_REF: ${{ github.base_ref || 'HEAD~1' }}
        run: npm run check:baseline-ratchet

      - name: Build Backend & Admin Dashboard
        run: npm run build:all

      # Gerbang desain & aksesibilitas (Fase 9). Wajib hijau dua kali berturut
      # sebelum langkah ini diaktifkan. Menjaga token warna, paritas dark mode,
      # nama aksesibel, kontras, dan format tanggal WIB.
      - name: Design & A11y Gates
        run: |
          cd packages/admin-dashboard
          npm run check:design

      - name: UI Reuse Gate
        run: npm run check:ui-reuse

      - name: Run Unit Tests (Baseline-Diff Gate)
        run: |
          npx vitest run --reporter=json --outputFile=ci-results.json || true
          node scripts/report-test-failures.mjs ci-results.json
          node scripts/audit-baseline-diff.mjs docs/audit/2026-11-10/after-f3-6.json ci-results.json

      # Artefak hasil test membantu penelusuran tanpa perlu membuka log job
      # (log Actions hanya bisa dibaca setelah login).
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-test-results
          path: ci-results.json
