name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Install Admin Dashboard Dependencies
        run: |
          cd packages/admin-dashboard
          npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Security Scan (Secret Leak Detection)
        run: npm run security:scan

      - name: Backlog Evidence Gate
        run: npm run verify:backlog

      - name: Typecheck Backend
        run: npm run typecheck

      - name: Build Backend & Admin Dashboard
        run: npm run build:all

      # Gerbang desain & aksesibilitas (Fase 9). Wajib hijau dua kali berturut
      # sebelum langkah ini diaktifkan. Menjaga token warna, paritas dark mode,
      # nama aksesibel, kontras, dan format tanggal WIB.
      - name: Design & A11y Gates
        run: |
          cd packages/admin-dashboard
          npm run check:design

      - name: Run Unit Tests (Baseline-Diff Gate)
        run: |
          npx vitest run --reporter=json --outputFile=ci-results.json || true
          node scripts/audit-baseline-diff.mjs docs/audit/2026-11-10/after-f3-6.json ci-results.json
