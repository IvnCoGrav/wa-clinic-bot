version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/wa_clinic_db?schema=public
      - WAHA_BASE_URL=${WAHA_BASE_URL:-http://waha:3000}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - CLINIC_LAT=${CLINIC_LAT:--7.2574719}
      - CLINIC_LNG=${CLINIC_LNG:-112.7520883}
      - HUMAN_HANDLING_TIMEOUT_HOURS=${HUMAN_HANDLING_TIMEOUT_HOURS:-6}
      - RESERVATION_FORM_URL=${RESERVATION_FORM_URL:-https://klinik-treatment.com/booking}
      - TRACKING_API_KEY=${TRACKING_API_KEY}
      - FB_PIXEL_ID=${FB_PIXEL_ID}
      - FB_CAPI_ACCESS_TOKEN=${FB_CAPI_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  # Click Catcher — microservice perantara untuk menangkap atribusi klik iklan Meta
  # dan meredirect customer ke WhatsApp dengan tracking code.
  # Dokumentasi: packages/click-catcher/README.md
  click-catcher:
    build:
      context: ./packages/click-catcher
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      # Gunakan nama service Docker 'app' agar bisa berkomunikasi via internal network
      - TRACKING_API_BASE_URL=http://app:3000
      - TRACKING_API_KEY=${TRACKING_API_KEY}
      - FB_PIXEL_ID=${FB_PIXEL_ID}
      - DEFAULT_WHATSAPP_PHONE=${DEFAULT_WHATSAPP_PHONE}
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wa_clinic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  waha:
    image: devlikeapro/waha:noweb-2026.7.2
    restart: always
    ports:
      - "3001:3000"
    environment:
      - WHATSAPP_SWAGGER_USERNAME=admin
      - WHATSAPP_SWAGGER_PASSWORD=admin12345
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=admin12345
      - WAHA_API_KEY=my_waha_api_key_secret
      # - WAHA_NOWEB_WA_VERSION_FORCE=2.3000.1012359200


volumes:
  postgres_data:
