services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    # Forward SEMUA var dari .env server ke container app (LLM/ORS/Redis/admin keys dll).
    # Nilai di blok `environment` di bawah tetap MENIMPA env_file — jadi var jaringan
    # (DATABASE_URL, WAHA_BASE_URL, PORT, HOST) aman memakai nilai container.
    # WAJIB: .env di server berisi ADMIN_API_KEY dan WAHA_WEBHOOK_SECRET.
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/wa_clinic_db?schema=public
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - WAHA_WEBHOOK_SECRET=${WAHA_WEBHOOK_SECRET}
      - WAHA_BASE_URL=${WAHA_BASE_URL:-http://waha:3000}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - CLINIC_LAT=${CLINIC_LAT:--7.2574719}
      - CLINIC_LNG=${CLINIC_LNG:-112.7520883}
      - CLINIC_NAME=${CLINIC_NAME}
      - HUMAN_HANDLING_TIMEOUT_HOURS=${HUMAN_HANDLING_TIMEOUT_HOURS:-6}
      - RESERVATION_FORM_URL=${RESERVATION_FORM_URL:-https://klinik-treatment.com/booking}
      - TRACKING_API_KEY=${TRACKING_API_KEY}
      - FB_PIXEL_ID=${FB_PIXEL_ID}
      - FB_CAPI_ACCESS_TOKEN=${FB_CAPI_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wa_clinic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  waha:
    image: devlikeapro/waha:noweb-2026.7.2
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - waha_sessions:/app/.sessions
    environment:
      - WHATSAPP_SWAGGER_USERNAME=admin
      - WHATSAPP_SWAGGER_PASSWORD=admin12345
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=admin12345
      - WAHA_API_KEY=my_waha_api_key_secret
      # Override WhatsApp Web version untuk mencegah regresi Noise Handshake (WA blocked stale version).
      # WAHA memakai versi ini hanya jika lebih tinggi dari bawaan (cek log "resolved version" saat start).
      # Ambil revision terbaru dari https://web.whatsapp.com/sw.js (cari "client_revision").
      - WAHA_NOWEB_WA_VERSION=2.3000.1044332936


volumes:
  postgres_data:
  waha_sessions:
  caddy_data:
  caddy_config:
