services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    volumes:
      - storage_data:/app/storage
    # Forward SEMUA var dari .env server ke container app (LLM/ORS/Redis/admin keys dll).
    # Nilai di blok `environment` di bawah tetap MENIMPA env_file — jadi var jaringan
    # (DATABASE_URL, WAHA_BASE_URL, PORT, HOST) aman memakai nilai container.
    # WAJIB: .env di server berisi ADMIN_API_KEY dan WAHA_WEBHOOK_SECRET.
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/wa_clinic_db?schema=public&connection_limit=20&pool_timeout=10
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - WAHA_WEBHOOK_SECRET=${WAHA_WEBHOOK_SECRET}
      - WAHA_BASE_URL=${WAHA_BASE_URL:-http://waha:3000}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - CLINIC_LAT=${CLINIC_LAT:--7.2574719}
      - CLINIC_LNG=${CLINIC_LNG:-112.7520883}
      - CLINIC_NAME=${CLINIC_NAME}
      - HUMAN_HANDLING_TIMEOUT_HOURS=${HUMAN_HANDLING_TIMEOUT_HOURS:-6}
      - TRACKING_API_KEY=${TRACKING_API_KEY}
      - FB_PIXEL_ID=${FB_PIXEL_ID}
      - FB_CAPI_ACCESS_TOKEN=${FB_CAPI_ACCESS_TOKEN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    command: postgres -c shared_buffers=256MB -c work_mem=16MB -c max_connections=100
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: wa_clinic_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  waha:
    image: devlikeapro/waha:noweb-2026.7.2
    restart: always
    volumes:
      - waha_sessions:/app/.sessions
    environment:
      - WHATSAPP_SWAGGER_USERNAME=admin
      - WHATSAPP_SWAGGER_PASSWORD=${WAHA_SWAGGER_PASSWORD:-admin12345}
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-admin12345}
      - WAHA_API_KEY=${WAHA_API_KEY:-my_waha_api_key_secret}
      - WAHA_CLIENT_DEVICE_NAME=Mac OS
      - WAHA_CLIENT_BROWSER_NAME=Safari
      # Secara default, override WA_VERSION dimatikan agar engine (Baileys) dapat melakukan auto-fetch
      # versi terbaru dari WhatsApp Web saat sesi dimulai. Aktifkan kembali HANYA jika auto-fetch rusak.
      # - WAHA_NOWEB_WA_VERSION=2.3000.1044619432


volumes:
  postgres_data:
  waha_sessions:
  caddy_data:
  caddy_config:
  redis_data:
  storage_data:
