<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 — Pengaturan Jam Operasional & Sistem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f0f2f5] p-6 text-[#111b21]">
  <div class="mx-auto max-w-6xl overflow-hidden rounded-3xl border border-[#e9edef] bg-white p-6 shadow-xl">
    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-[#e9edef] pb-5 mb-6">
      <div>
        <h1 class="text-lg font-bold text-[#111b21]">Pengaturan Operasional & Konfigurasi Bot</h1>
        <p class="text-xs text-[#54656f]">Jam Layanan Klinik, Batas Kuota Booking Harian, & Alamat Pusat</p>
      </div>
      <button class="rounded-xl bg-[#008069] px-4 py-2 text-xs font-bold text-white shadow-xs hover:bg-[#00a884]">
        Simpan Perubahan
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-xs">
      <div class="rounded-2xl border border-[#e9edef] p-5 space-y-3">
        <h2 class="font-bold text-[#111b21] border-b border-[#e9edef] pb-2">Jam Buka & Operasional</h2>
        <div>
          <label class="text-[#54656f] block mb-1">Jam Buka Layanan</label>
          <input type="text" readonly value="08:00 WIB" class="w-full rounded-xl border border-[#d1d7db] p-2 bg-[#f8fafc]">
        </div>
        <div>
          <label class="text-[#54656f] block mb-1">Jam Tutup Layanan</label>
          <input type="text" readonly value="17:00 WIB" class="w-full rounded-xl border border-[#d1d7db] p-2 bg-[#f8fafc]">
        </div>
      </div>

      <div class="rounded-2xl border border-[#e9edef] p-5 space-y-3">
        <h2 class="font-bold text-[#111b21] border-b border-[#e9edef] pb-2">Batas Kuota Kunjungan</h2>
        <div>
          <label class="text-[#54656f] block mb-1">Maksimal Kunjungan per Hari</label>
          <input type="text" readonly value="12 Kunjungan" class="w-full rounded-xl border border-[#d1d7db] p-2 bg-[#f8fafc]">
        </div>
        <div>
          <label class="text-[#54656f] block mb-1">Jeda Waktu Antar Sesi</label>
          <input type="text" readonly value="30 Menit (Perjalanan)" class="w-full rounded-xl border border-[#d1d7db] p-2 bg-[#f8fafc]">
        </div>
      </div>

      <div class="rounded-2xl border border-[#e9edef] p-5 space-y-3">
        <h2 class="font-bold text-[#111b21] border-b border-[#e9edef] pb-2">Alamat Klinik & Titik GPS Pusat</h2>
        <div>
          <label class="text-[#54656f] block mb-1">Lokasi Markas Utama</label>
          <textarea readonly class="w-full rounded-xl border border-[#d1d7db] p-2 bg-[#f8fafc] h-20">Kala Mom & Baby Care, Jl. Tebet Raya No. 45, Jakarta Selatan (Titik Nol Radius Ongkir)</textarea>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
